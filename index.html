<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENERGY LAB</title>
<meta name="description" content="Energidrikktest: smak og smak vs. pris, 1–10. Legg inn din egen test, se topplista og kåringene.">
<meta property="og:title" content="ENERGY LAB">
<meta property="og:image" content="logo.jpg">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#07122b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ENERGY LAB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: kåringsshow mellom kompiser – stolt, litt høylytt, men ryddig
   IDEA: et premieutdelingsark / resultattavle for ukens boks
   PICTURE: stort bilde av boksen + gigantisk totalscore, som Kebabtesten
   COLOUR and TYPE: logoens nattblå, gull og isblå; Anton + Inter
   LAYOUT: Kebabtesten-malen – hero, kåringer, toppliste + dommerpanel, alle drikker */
:root{color-scheme:dark;
  --bg:#07122b;--panel:#0e1c3d;--panel2:#142650;--line:#223766;--line2:#1a2c55;
  --ink:#f4f6fb;--muted:#9fb0d0;--gold:#e2c98f;--gold2:#f1dcaa;--ice:#4aa3ff;--ink-on-gold:#1a1408;
  --good:#8fe08a;--bad:#ff8a7a}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px;scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;
  background:radial-gradient(1100px 520px at 50% -220px,#17336f 0%,transparent 70%),var(--bg)}
a{color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 72px;display:flex;flex-direction:column;gap:44px}
.h{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.3px;text-transform:uppercase;margin:0;line-height:1.05}
.lbl{font-size:12px;font-weight:800;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
/* bunnmeny */
.toplink{color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;padding:10px 6px}
.qbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:Anton,sans-serif;font-size:20px;cursor:pointer}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#060d20;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);border-radius:0;gap:0}
nav.bnav .in{max-width:720px;width:100%;margin:0 auto;height:72px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding-top:8px}
nav.bnav a{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;min-height:48px;border-radius:0;background:none}
nav.bnav a.on{color:var(--gold);background:none}
nav.bnav a.plus{justify-self:center;margin-top:-26px;width:62px;height:62px;border-radius:50%;background:var(--gold);color:var(--ink-on-gold);display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg);padding:0;min-height:0}
nav.bnav a.plus:active{transform:scale(.95)}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px 0;margin:-12px 0 -20px;background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.brand img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(0,0,0,.5);background:#fff}
.brand .h{font-size:32px}.brand .h span{color:var(--gold)}
.brand small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.notice{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice b{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:11px 18px;font-weight:700;min-height:44px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink-on-gold)}

/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:28px;align-items:stretch}
.shot{position:relative;border-radius:24px;min-height:420px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(60% 60% at 50% 45%,#1d3d82,transparent 70%),repeating-linear-gradient(135deg,#0f1f45 0 14px,#0c1a3b 14px 28px)}
.shot img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:#6f84b3;font-weight:600}
.badge{position:absolute;left:18px;top:18px;background:var(--gold);color:var(--ink-on-gold);font-weight:800;font-size:12px;letter-spacing:1.1px;padding:7px 12px;border-radius:999px;text-transform:uppercase}
.hero-info{display:flex;flex-direction:column;gap:20px;justify-content:center}
.hero-info .h1{font-size:clamp(38px,6vw,56px);margin:8px 0 8px;text-wrap:balance}
.meta{color:var(--muted);font-size:15px}
.score-big{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.score-big .n{font-family:Anton,sans-serif;font-size:clamp(76px,12vw,108px);line-height:.85;color:var(--gold)}
.score-big .split{font-size:14px;color:#cdd6ea;margin-top:6px}.score-big b{color:var(--ink)}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:14px}
.bar-row span{color:var(--muted);font-weight:600}.bar-row b{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ice);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bar.g i{background:var(--gold)}
@keyframes grow{from{transform:scaleX(0)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 11px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.quote{margin:0;font-style:italic;color:#cdd6ea;font-size:16px}
.also{margin-top:-18px}
.also .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

/* awards */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h .h{font-size:28px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.award{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.award .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.award .t{font-size:12px;font-weight:800;letter-spacing:1.3px;color:var(--gold);text-transform:uppercase}
.award .s{font-family:Anton,sans-serif;font-size:34px;line-height:1;color:var(--gold2)}
.award .p{font-size:19px;font-weight:800;line-height:1.25}
.award .sub{font-size:13px;color:var(--muted)}
.award.none .p{color:var(--muted);font-size:15px;font-weight:600}

/* board + jury */
.split2{display:flex;flex-wrap:wrap;gap:28px}
.split2>.main{flex:999 1 560px}.split2>.side{flex:1 1 300px;display:flex;flex-direction:column;gap:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:9px 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.pill.on{border-color:var(--gold);color:var(--gold)}
.board{background:#0b1834;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.br{display:grid;grid-template-columns:44px minmax(0,1fr) 64px 64px 78px 76px;gap:8px;padding:14px 18px;align-items:center;border-top:1px solid var(--line2)}
.br.head{border-top:0;background:#11214a;font-size:11px;font-weight:800;letter-spacing:1.1px;color:var(--muted);padding-block:12px}
.br .rk{font-family:Anton,sans-serif;font-size:22px;color:#5d72a3}
.br .nm b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .nm small{display:block;font-size:12px;color:var(--muted)}
.br .c{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.br .c.sel{color:var(--gold)}
.br .tot{text-align:right;font-family:Anton,sans-serif;font-size:21px;color:var(--gold2)}
.br.head .c,.br.head .tot{font-family:Inter;font-size:11px;color:var(--muted)}
.br .nm .mob{display:none}
@media(max-width:640px){
  .br{grid-template-columns:32px minmax(0,1fr) 60px;padding:13px 14px}
  .br .c{display:none}.br .nm .mob{display:block;font-size:12px;color:var(--muted)}
}
.judge{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:18px;color:#1a1408;background:linear-gradient(135deg,var(--gold2),#b8995a)}
.judge .jn{font-weight:800}.judge .js{font-size:13px;color:var(--muted)}.judge .js b{color:var(--ink)}
.judge>div:nth-child(2){flex:1}
.tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.7px;padding:4px 9px;border-radius:99px;margin-left:auto;white-space:nowrap}
.tag.kind{background:#1f3322;color:var(--good)}.tag.hard{background:#3d1f1c;color:var(--bad)}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.add{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:999px;background:var(--gold);color:var(--ink-on-gold);font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.judge{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.judge:hover{border-color:var(--gold)}
.icons{font-size:18px;letter-spacing:2px;margin-top:3px}
.ghost{display:block;text-align:center;padding:13px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:transparent;font-weight:800;width:100%}
.folk .who{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.pname{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-size:19px;font-weight:800;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:rgba(226,201,143,.4);text-underline-offset:4px}
.award .ic{font-size:30px;line-height:1}
button.chip{border:0;font:inherit;font-size:13px;cursor:pointer}
.bar-row .bm{justify-self:start}
.prat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.cm{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cm .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cm .who{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.cm .what{font-size:13px;color:var(--muted)}
.cm p{margin:0;font-size:16px}
.like{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.like.on{border-color:var(--gold);color:var(--gold);background:rgba(226,201,143,.1)}
.me{font-size:13px;color:var(--muted)}.me button{background:none;border:0;color:var(--gold);font:inherit;font-weight:700;cursor:pointer;padding:4px}
.award .bm{margin-top:4px}
.cta{display:block;text-align:center;padding:15px;border-radius:999px;background:var(--gold);color:var(--ink-on-gold);font-weight:800;text-decoration:none;margin-top:4px}

/* all */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px}
.nylig{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1*clamp(16px,3vw,32px));padding:0 clamp(16px,3vw,32px) 4px;scroll-padding:0 clamp(16px,3vw,32px)}
.nylig::-webkit-scrollbar{display:none}
.nt{flex:0 0 min(300px,76vw);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.nt .im{height:180px;position:relative;background:repeating-linear-gradient(135deg,#0f1f45 0 12px,#0c1a3b 12px 24px);display:grid;place-items:center;color:#5d72a3}
.nt .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nt .im::after{content:"";position:absolute;inset:auto 0 0;height:60px;background:linear-gradient(transparent,rgba(5,12,30,.75));pointer-events:none}
.nt .tag{position:absolute;left:12px;top:12px;z-index:1;background:rgba(5,12,30,.82);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;padding:7px 11px;border-radius:12px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .sc{position:absolute;right:12px;top:12px;z-index:1;background:var(--gold);color:var(--ink-on-gold);font-family:Anton,sans-serif;font-size:22px;line-height:1;padding:8px 10px;border-radius:14px}
.nt .dt{position:absolute;left:12px;bottom:10px;z-index:1;font-weight:700;font-size:13px;color:#e6ebf7}
.nt .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.nt h3{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:24px;line-height:1.05;text-transform:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt .who{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .who button{background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer}
.nt .lk{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;font-size:14px;margin-top:auto;padding-top:4px}
.nt .lk span{color:var(--ink)}
.nt[data-session],.card[data-drink]{cursor:pointer;transition:transform .15s}
.nt[data-session]:active,.card[data-drink]:active{transform:scale(.98)}
.nt[data-session]:focus-visible,.card[data-drink]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.more{font-size:12px;font-weight:700;color:var(--gold)}
.dt-hero{position:relative;height:220px;margin:-22px -18px 16px;border-radius:24px 24px 0 0;overflow:hidden;background:repeating-linear-gradient(135deg,#0f1f45 0 12px,#0c1a3b 12px 24px);display:grid;place-items:center;color:#5d72a3}
.dt-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dt-hero::after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.dt-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.dt-tot{font-family:Anton,sans-serif;font-size:44px;line-height:.9;color:var(--gold);text-align:right}
.dt-tot small{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);margin-top:4px}
.dt-r{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dt-r .rh{display:flex;align-items:center;gap:10px}
.dt-r .rh .nm{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;font-weight:800;font-size:16px;color:var(--ink);text-align:left;cursor:pointer}
.dt-r .rt{font-family:Anton,sans-serif;font-size:24px;color:var(--gold)}
.dt-r .sv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dt-r .sv div{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted);font-weight:700}
.dt-r .sv b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:22px;color:var(--ink);line-height:1.1}
.dt-r p{margin:0;font-size:15px;line-height:1.45}
.dt-list{display:flex;flex-direction:column;gap:8px}
.sharecard{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.sharecard .qr{flex:0 0 auto;width:132px;height:132px;border-radius:14px;background:#fff}
.sharecard .btns,.shr .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.shr{margin-top:16px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;gap:14px;align-items:center}
.shr img{width:92px;height:92px;border-radius:12px;background:#fff;flex:0 0 auto}
.ed-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:120;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:12px 16px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}
@media(max-width:520px){.sharecard{flex-direction:column;text-align:center}.sharecard .btns{justify-content:center}}
.seall{color:var(--gold);font-weight:700;font-size:15px;text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .im{height:160px;position:relative;background:repeating-linear-gradient(135deg,#0f1f45 0 12px,#0c1a3b 12px 24px);display:grid;place-items:center;color:#5d72a3}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .bd{padding:16px;display:flex;flex-direction:column;gap:12px}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:18px;line-height:1.2}
.card .tt{font-family:Anton,sans-serif;font-size:36px;line-height:.9;color:var(--gold)}
.card .bar-row{grid-template-columns:100px minmax(0,1fr) 30px;font-size:13px}
.wk{margin:26px 0 12px;font-size:22px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);min-height:44px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
footer{font-size:13px;color:#7489b8;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:600px){
  header{position:static;margin:0}
  .brand img{width:48px;height:48px}.brand .h{font-size:24px}.brand small{display:none}
  .shot{min-height:260px}
  .bar-row{grid-template-columns:96px minmax(0,1fr) 30px}
  .wrap{gap:36px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#siste">
      <img src="logo.jpg" alt="ENERGY LAB-logo">
      <div><div class="h">ENERGY <span>LAB</span></div><small>Smak og smak vs. pris får hver sin score fra 1 til 10</small></div>
    </a>
    <div class="hdr-r">
      <a class="toplink" href="om.html">Om</a>
      <button type="button" class="qbtn" data-welcome aria-label="Slik funker det">?</button>
    </div>
  </header>

  <div class="notice hidden" id="notice"></div>

  <section id="siste"></section>
  <section id="del"></section>
  <section id="prat"></section>
  <section id="kaaringer"></section>
  <section id="folk"></section>
  <section id="toppliste" class="split2"></section>
  <section id="alle"></section>

  <footer>
    <span>Totalscoren er snittet av smak og smak vs. pris. Alle kan legge inn en test, og hver vurdering teller likt.</span>
    <span><span id="updated"></span> <button type="button" data-welcome style="background:none;border:0;color:var(--gold);font:inherit;font-weight:700;cursor:pointer;padding:4px 0">Slik funker det</button> · <button type="button" data-a2hs style="background:none;border:0;color:var(--gold);font:inherit;font-weight:700;cursor:pointer;padding:4px 0">Lagre som app</button> · <a href="om.html" style="font-weight:700">Om siden</a></span>
  </footer>
</div>

<script src="config.js?v=2026-11-27a"></script>
<script src="qr.js?v=2026-11-27a"></script>
<script src="parse.js?v=2026-11-27a"></script>
<script src="badges.js?v=2026-11-27a"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TESTERS = ['Itrat Zishan', 'Tobias Frost', 'Atle Conradsen', 'Truls Blingø'];
const quote = t => t.notes.length ? `«${esc(t.notes[0].text)}»${t.notes[0].name ? ' – ' + esc(t.notes[0].name.split(' ')[0]) : ''}` : '';
const nR = t => t.scores.length + (t.scores.length === 1 ? ' vurdering' : ' vurderinger');
const avg = a => { a = a.filter(x => x != null); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
const f1 = v => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const kr = v => v == null ? '' : v.toLocaleString('nb-NO', {maximumFractionDigits: 2}) + '\u00a0kr';
const MND = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
const dato = t => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t || ''); return m ? `${+m[3]}. ${MND[+m[2] - 1]} ${m[1]}` : ''; };
const CAN = `<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l1 2v14l-1 2H8l-1-2V5z"/><path d="M7 7h10M7 17h10"/><path d="M13 9l-2.5 3.5h3L11 16"/></svg>`;

let ratings = [], likes = new Map(), tests = [], sessions = [], sortKey = 'total', allSort = 'time';

const byTotal = (a, b) => (b.total ?? -1) - (a.total ?? -1);
const perL = v => v == null ? '' : kr(Math.round(v * 10) / 10) + '/l';
const metaLine = t => [t.brand, t.ml ? t.ml + '\u00a0ml' : '', kr(t.price), perL(t.perL)].filter(Boolean).join(' · ');
const byTime = (a, b) => (b.time || '').localeCompare(a.time || '');
const bar = (label, v, size) => `<div class="bar-row"><span>${label}${label === 'Smak vs. pris' ? window.EDBadges.IB : ''}</span>${window.EDBadges.meter(v, size || '')}<b>${f1(v)}</b></div>`;
const img = (t, cls) => t.photo ? `<img class="${cls || ''}" src="${esc(t.photo)}" alt="${esc(t.drink)}" loading="lazy" onerror="this.remove()">` : '';

// Én «test» = én innsending: samme tidspunkt og samme drikk (kan ha flere testere)
function toSessions(rs) {
  const m = new Map();
  for (const r of rs) { const k = r.time + '|' + EDParse.drinkKey(r.drink); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return [...m.values()].map(g => {
    const d = tests.find(x => x.key === EDParse.drinkKey(g[0].drink)) || {};
    const pick = f => (g.find(r => r[f] != null && r[f] !== '') || {})[f] ?? null;
    const taste = avg(g.map(r => r.taste)), value = avg(g.map(r => r.value));
    const price = pick('price'), ml = pick('ml');
    return { key: d.key, drink: d.drink || g[0].drink, brand: pick('brand') || d.brand || '', time: g[0].time, price, ml,
      perL: price != null && ml ? price / ml * 1000 : null, photo: pick('photo') || d.photo || '',
      notes: g.filter(r => r.note).map(r => ({name: r.name, text: r.note})), scores: g.map(r => ({name: r.name, taste: r.taste, value: r.value})),
      taste, value, total: taste != null && value != null ? (taste + value) / 2 : (taste ?? value), drinkAll: d, rows: g };
  }).sort(byTime);
}

const THUMB = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M7 10l4-8a3 3 0 0 1 3 3v4h5.5a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.1 21H7"/></svg>';
function renderNylig() {
  const box = $('#siste'), rest = sessions.slice(0, 12);
  if (!rest.length) { box.innerHTML = `<div class="empty"><b>Ingen tester publisert ennå</b>Første test dukker opp her så snart den er lagt inn.</div>`; return; }
  box.innerHTML = `<div class="sec-h"><h2 class="h">Siste tester</h2><a class="seall" href="#alle">Se alle</a></div><div class="nylig">${rest.map(t => {
    const who = t.scores.map(s => s.name);
    const whoH = who.slice(0, 2).map(n => `<button type="button" data-person="${esc(n)}">${esc(n)}</button>`).join(' og ') + (who.length > 2 ? ` +${who.length - 2}` : '');
    const nl = t.rows.reduce((n, r) => n + ((likes.get(EDParse.cid(r)) || new Set()).size), 0);
    return `<div class="nt" data-session="${sessions.indexOf(t)}" role="button" tabindex="0" aria-label="Se testen av ${esc(t.drink)}"><div class="im">${t.photo ? `<img src="${esc(t.photo)}" alt="${esc(t.drink)}" loading="lazy" onerror="this.remove()">` : ''}${CAN}
        ${t.brand ? `<div class="tag">${esc(t.brand)}</div>` : ''}<div class="sc">${f1(t.total)}</div><div class="dt">${esc(dato(t.time))}</div></div>
      <div class="bd"><h3>${esc(t.drink)}</h3><div class="who">${[t.ml ? t.ml + '\u00a0ml' : '', kr(t.price)].filter(Boolean).map(esc).concat(whoH).join(' · ')}</div>
        ${window.EDBadges.meter(t.total, 'sm')}<div class="lk">${THUMB}<span>${nl}</span><span class="more" style="margin-left:auto">Se testen ›</span></div></div></div>`; }).join('')}</div>`;
}

function best(list, key, low) {
  const l = list.filter(t => t[key] != null);
  return l.length ? l.reduce((a, b) => (low ? b[key] < a[key] : b[key] > a[key]) ? b : a) : null;
}
function renderAwards() {
  const n = tests.length;
  const aw = [
    ['Smakskongen', best(tests, 'taste'), 'taste', t => `Best smak av ${n} drikker · ${nR(t)}`],
    ['Mest for pengene', best(tests, 'value'), 'value', t => t.perL != null ? `${kr(Math.round(t.perL * 10) / 10)} per liter` : 'Høyest smak vs. pris'],
    ['Totalvinner', best(tests, 'total'), 'total', t => [t.brand, nR(t)].filter(Boolean).join(' · ')],
    ['Bunnskraperen', n > 1 ? best(tests, 'total', true) : null, 'total', t => 'Laveste totalscore så langt']
  ];
  $('#kaaringer').innerHTML = `<div class="sec-h"><h2 class="h">Kåringer</h2></div><div class="awards">${aw.map(([title, t, k, sub]) => t
    ? `<div class="award"><div class="top"><div class="t">${title}${title === 'Mest for pengene' ? window.EDBadges.IB : ''}</div><div class="s">${f1(t[k])}</div></div><div class="p">${esc(t.drink)}</div>${window.EDBadges.meter(t[k], 'sm')}<div class="sub">${esc(sub(t))}</div></div>`
    : `<div class="award none"><div class="t">${title}</div><div class="p">Kåres når testene er inne</div></div>`).join('')}</div>`;
}

const me = () => { try { return localStorage.getItem('ed-me') || ''; } catch { return ''; } };
function askName(then) {
  const B = window.EDBadges;
  B.sheet(`<h3>Hvem er du?</h3><p class="ksub">Skriv kallenavnet ditt. Det samme navnet brukes når du legger inn tester.</p>
    <form id="nmF" style="display:flex;gap:8px;margin-top:12px"><input id="nmI" maxlength="40" required placeholder="Kallenavn" style="flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px"><button class="add" style="border:0;cursor:pointer">Lagre</button></form>`,
    (ov, close) => { const i = ov.querySelector('#nmI'); i.value = me(); i.focus(); ov.querySelector('#nmF').addEventListener('submit', e => { e.preventDefault(); const v = i.value.trim().slice(0, 40); if (!v) return; try { localStorage.setItem('ed-me', v); } catch {} close(); renderPrat(); if (then) then(v); }); });
}
function renderPrat() {
  const box = $('#prat'), B = window.EDBadges;
  const notes = ratings.filter(r => r.note).sort((a, b) => String(b.time).localeCompare(String(a.time))).slice(0, 12);
  if (!notes.length) { box.innerHTML = ''; return; }
  const m = me().toLowerCase();
  box.innerHTML = `<div class="sec-h"><h2 class="h">Siste kommentarer</h2><div class="me">${m ? `Du er <b>${esc(me())}</b> <button type="button" data-rename>Bytt</button>` : `<button type="button" data-rename>Hvem er du?</button>`}</div></div>
    <div class="prat">${notes.map(r => { const id = EDParse.cid(r), set = likes.get(id) || new Set(), on = m && set.has(m); return `<div class="cm"><div class="top"><button type="button" class="who" data-person="${esc(r.name)}">${esc(r.name)}</button><span class="what">${esc(dato(r.time))}</span></div>
      <div class="what">${esc(r.drink)} · ${f1(avg([r.taste, r.value]))}</div><p>«${esc(r.note)}»</p>
      <button type="button" class="like${on ? ' on' : ''}" data-like="${id}" aria-pressed="${on ? 'true' : 'false'}">👍 ${set.size || ''}</button></div>`; }).join('')}</div>`;
}
async function toggleLike(id) {
  const cfg = window.EDConfig || {}, who = me();
  if (!who) return askName(() => toggleLike(id));
  const k = who.toLowerCase(), set = likes.get(id) || new Set();
  const had = set.has(k); had ? set.delete(k) : set.add(k); likes.set(id, set);
  window.EDBadges.setLikes(likes); renderPrat(); renderNylig(); renderFolk(); renderBoard(); refreshDetail();
  try {
    const r = await fetch(cfg.SCRIPT_URL, {method: 'POST', body: JSON.stringify({action: 'like', id, fra: who})});
    const res = await r.json(); if (!res.ok) throw new Error(res.feil);
    if (res.liked === had) { had ? set.add(k) : set.delete(k); window.EDBadges.setLikes(likes); renderPrat(); renderNylig(); renderFolk(); renderBoard(); refreshDetail(); }
  } catch { had ? set.add(k) : set.delete(k); window.EDBadges.setLikes(likes); renderPrat(); renderNylig(); renderFolk(); renderBoard(); refreshDetail(); }
}

function renderFolk() {
  const B = window.EDBadges, box = $('#folk');
  const ps = B.peopleStats(ratings);
  if (!ps.length) { box.innerHTML = ''; return; }
  const names = people => people.map(p => `<button type="button" class="pname" data-person="${esc(p.name)}">${esc(p.name)}</button>`).join('');
  const card = (icon, title, people, sub) => `<div class="award folk"><div class="top"><div class="t">${esc(title)}</div><div class="ic" aria-hidden="true">${icon}</div></div><div class="who">${names(people)}</div><div class="sub">${esc(sub)}</div></div>`;
  const pm = B.prevMonth(), mw = B.pointsIn(ratings, pm);
  const now = new Date(), cm = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`, cl = B.pointsIn(ratings, cm), yl = B.pointsIn(ratings, String(now.getFullYear()));
  const cards = [];
  if (mw.length) cards.push(card('🤠', `Månedens koffeinkonge · ${B.monthName(pm)}`, mw, `${mw[0].pts} poeng`));
  if (cl.length) cards.push(card('⏳', `Leder i ${B.monthName(cm)}`, cl, `${cl[0].pts} poeng så langt`));
  if (yl.length) cards.push(card('🏆', `Årets koffeinkonge ${now.getFullYear()} · leder nå`, yl, `${yl[0].pts} poeng`));
  B.titles(ratings, ps).forEach(t => cards.push(card(t.icon, t.title, t.people, t.sub(t.people[0]) + (t.people.length > 1 ? ' hver' : ''))));
  box.innerHTML = `<div class="sec-h"><h2 class="h">Folkets kåringer</h2><button type="button" class="pill" data-info>Badges og regler</button></div><div class="awards">${cards.join('')}</div>`;
}

function renderBoard() {
  const opts = [['total', 'Total'], ['taste', 'Smak'], ['value', 'Smak vs. pris'], ['perL', 'Kr per liter']];
  const list = [...tests].sort((a, b) => sortKey === 'perL' ? (a.perL ?? 1e9) - (b.perL ?? 1e9) : (b[sortKey] ?? -1) - (a[sortKey] ?? -1));
  const colors = ['var(--gold)', '#d8dfec', '#d08a5a'];
  const rows = list.map((t, i) => `<div class="br"><span class="rk" style="${i < 3 ? 'color:' + colors[i] : ''}">${i + 1}</span>
    <span class="nm"><b>${esc(t.drink)}</b><small>${esc([t.brand, nR(t)].filter(Boolean).join(' · '))}</small><small>${window.EDBadges.meter(t.total, 'sm')}</small>
      <small class="mob">Smak ${f1(t.taste)} · verdi ${f1(t.value)}${t.perL != null ? ' · ' + esc(perL(t.perL)) : ''}</small></span>
    <span class="c${sortKey === 'taste' ? ' sel' : ''}">${f1(t.taste)}</span><span class="c${sortKey === 'value' ? ' sel' : ''}">${f1(t.value)}</span>
    <span class="c${sortKey === 'perL' ? ' sel' : ''}">${t.perL != null ? esc(kr(Math.round(t.perL))) : '–'}</span><span class="tot">${f1(t.total)}</span></div>`).join('');
  const B = window.EDBadges, ps = B.peopleStats(ratings).sort((a, b) => b.points - a.points || b.n - a.n);
  $('#toppliste').innerHTML = `<div class="main">
      <div class="sec-h"><h2 class="h">Toppliste</h2><div class="pills">${opts.map(([k, l]) => `<button class="pill${k === sortKey ? ' on' : ''}" data-sort="${k}">${l}</button>`).join('')}</div></div>
      ${tests.length ? `<div class="board"><div class="br head"><span>#</span><span>Drikk</span><span class="c">Smak</span><span class="c">Verdi${window.EDBadges.IB}</span><span class="c">Kr/l</span><span class="tot">Total</span></div>${rows}</div>`
        : `<div class="empty"><b>Topplista er tom</b>Den fylles opp etter hvert som drikkene testes.</div>`}
    </div>
    <div class="side"><h2 class="h" style="font-size:28px;margin-bottom:4px">Testere</h2>
      ${ps.length ? ps.slice(0, 10).map(p => { const bs = B.badgesOf(p).filter(x => x.done); return `<button type="button" class="judge" data-person="${esc(p.name)}">${B.avatarHtml(p.name, ratings)}
        <div><div class="jn">${esc(p.name)}</div><div class="js">${p.n} ${p.n === 1 ? 'test' : 'tester'} · <b>${bs.length}</b> badges</div>${bs.length ? `<div class="icons" aria-hidden="true">${bs.slice(-6).map(x => x.icon).join('')}</div>` : ''}</div></button>`; }).join('')
        : `<div class="empty"><b>Ingen testere ennå</b>Legg inn en test, så starter badge-jakten.</div>`}
      <button type="button" class="ghost" data-info>Se alle badges</button>
      <a class="cta" href="legg-inn.html">+ Legg inn ny test</a>
    </div>`;
}

function card(t) {
  return `<article class="card" data-drink="${esc(t.key)}" role="button" tabindex="0" aria-label="Se alle tester av ${esc(t.drink)}"><div class="im">${CAN}${img(t)}</div><div class="bd">
    <div class="hd"><div><h3>${esc(t.drink)}</h3><div class="meta" style="font-size:13px">${esc(metaLine(t))}</div><div class="meta" style="font-size:13px">${dato(t.time) ? 'Sist testet ' + esc(dato(t.time)) + ' · ' : ''}${nR(t)}</div></div><div class="tt">${f1(t.total)}</div></div>
    <div>${window.EDBadges.meter(t.total, 'sm')}</div>
    <div class="bars">${bar('Smak', t.taste, 'sm')}${bar('Smak vs. pris', t.value, 'sm')}</div>
    ${t.notes.length ? `<p class="quote" style="font-size:14px">${quote(t)}</p>` : ''}<span class="more">Se hva alle ga ›</span></div></article>`;
}
function renderAll() {
  const opts = [['time', 'Sist testet'], ['total', 'Best'], ['name', 'A–Å']];
  let html = `<div class="sec-h"><h2 class="h">Alle drikker</h2><div class="pills">${opts.map(([k, l]) => `<button class="pill${k === allSort ? ' on' : ''}" data-all="${k}">${l}</button>`).join('')}</div></div>`;
  if (!tests.length) html += `<div class="empty"><b>Ingen drikker ennå</b>Alle drikker som er testet, samles her.</div>`;
  const l = [...tests].sort(allSort === 'time' ? byTime : allSort === 'total' ? byTotal : (a, b) => a.drink.localeCompare(b.drink, 'nb'));
  if (l.length) html += `<div class="grid">${l.map(card).join('')}</div>`;
  $('#alle').innerHTML = html;
}

// ----- detaljvisning: hva hver tester ga -----
let detail = null; // { kind, ref, ov }
function ratingRow(r) {
  const B = window.EDBadges, id = EDParse.cid(r), set = likes.get(id) || new Set(), m = me().toLowerCase(), on = m && set.has(m);
  const tot = r.taste != null && r.value != null ? (r.taste + r.value) / 2 : (r.taste ?? r.value);
  return `<div class="dt-r"><div class="rh">${B.avatarHtml(r.name, ratings)}<button type="button" class="nm" data-person="${esc(r.name)}">${esc(r.name)}</button><span class="rt">${f1(tot)}</span></div>
    <div class="sv"><div>Smak<b>${r.taste ?? '–'}</b></div><div>Smak vs. pris<b>${r.value ?? '–'}</b></div></div>
    ${r.note ? `<p>«${esc(r.note)}»</p>` : ''}
    <button type="button" class="like${on ? ' on' : ''}" data-like="${id}" aria-pressed="${on ? 'true' : 'false'}" aria-label="${on ? 'Fjern like' : 'Lik vurderingen til ' + esc(r.name)}">👍 ${set.size || ''}</button></div>`;
}
function detailHtml(kind, ref) {
  if (kind === 'session') {
    const t = sessions.find(x => x.time === ref.time && x.key === ref.key); if (!t) return '';
    return `<div class="dt-hero">${CAN}${img(t)}</div>
      <div class="dt-top"><div style="min-width:0"><h3>${esc(t.drink)}</h3><div class="ksub">${esc(metaLine(t))}</div><div class="ksub">${esc(dato(t.time))} · ${nR(t)}</div></div><div class="dt-tot">${f1(t.total)}<small>TOTAL</small></div></div>
      <div style="margin-top:14px">${window.EDBadges.meter(t.total, 'sm')}</div>
      <div class="bars" style="margin-top:12px">${bar('Smak', t.taste, 'sm')}${bar('Smak vs. pris', t.value, 'sm')}</div>
      <div class="lbl2">Hva hver tester ga</div><div class="dt-list">${t.rows.map(ratingRow).join('')}</div>
      ${(() => { const d = tests.find(x => x.key === t.key); return d ? shareBlock(d) : ''; })()}
      ${t.drinkAll && t.drinkAll.key && ratings.filter(r => EDParse.drinkKey(r.drink) === t.key).length > t.rows.length ? `<button type="button" class="ghost" style="margin-top:14px;width:100%" data-drink-open="${esc(t.key)}">Se alle tester av ${esc(t.drink)}</button>` : ''}`;
  }
  const d = tests.find(x => x.key === ref.key); if (!d) return '';
  const ss = sessions.filter(x => x.key === d.key);
  return `<div class="dt-hero">${CAN}${img(d)}</div>
    <div class="dt-top"><div style="min-width:0"><h3>${esc(d.drink)}</h3><div class="ksub">${esc(metaLine(d))}</div><div class="ksub">${nR(d)}</div></div><div class="dt-tot">${f1(d.total)}<small>SNITT</small></div></div>
    <div class="bars" style="margin-top:14px">${bar('Smak', d.taste, 'sm')}${bar('Smak vs. pris', d.value, 'sm')}</div>
    ${shareBlock(d)}
    ${ss.map(t => `<div class="lbl2">${esc(dato(t.time) || 'Uten dato')} · ${f1(t.total)}</div><div class="dt-list">${t.rows.map(ratingRow).join('')}</div>`).join('')}`;
}
function openDetail(kind, ref) {
  if (detail && detail.ov && document.body.contains(detail.ov)) detail.ov.remove();
  const html = detailHtml(kind, ref); if (!html) return;

function drawQR(x, text, px, py, size, dark) {
  const m = window.KTQR(text, 'M'), n = m.length, q = 2, cell = Math.floor(size / (n + q * 2)), real = cell * (n + q * 2), off = Math.floor((size - real) / 2);

async function openStory(key) {
